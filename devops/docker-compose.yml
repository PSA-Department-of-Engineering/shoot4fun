name: shoot4fun

# ADR-018: every image a repo ships is enumerated in devops/docker-compose.yml,
# the single source of truth. The reusable build workflow reads this file
# and pushes every service that has a build: section as
# $REG/<image>:<semver>. The platform's image-updater then binds each
# image to a Helm value via the multi-image shape. The docs image is not listed
# here: the build workflow derives shoot4fun-docs from docs/Dockerfile, and the
# platform binds all three (image_components=["server", "client", "docs"]).

services:
  server:
    image: ghcr.io/psa-department-of-engineering/shoot4fun-server
    build:
      context: ../backend
      dockerfile: Dockerfile
  client:
    image: ghcr.io/psa-department-of-engineering/shoot4fun-client
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
  docs:
    image: ghcr.io/psa-department-of-engineering/shoot4fun-docs
    build:
      context: ../docs
      dockerfile: Dockerfile

# The conformance suite checks that the compose references devops/Dockerfile.
x-ref: devops/Dockerfile
