{{- if .Values.systemAccounts.password }}
# The system test accounts' admin password (SYSTEM_ACCOUNT_PASSWORD), read by
# the server container via secretKeyRef. Rendered here so the deploy branch's
# value is the one place the password is set; swap to an externally-managed
# Secret by emptying the value and naming the secret in the template if the
# stakes ever rise above a homelab test login.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shoot4fun.name" . }}-system-accounts
  labels:
    app: {{ include "shoot4fun.name" . }}
type: Opaque
stringData:
  password: {{ .Values.systemAccounts.password | quote }}
{{- end }}
