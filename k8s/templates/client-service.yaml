apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoot4fun.name" . }}-client
  labels:
    app: {{ include "shoot4fun.name" . }}-client
spec:
  selector:
    app: {{ include "shoot4fun.name" . }}-client
  ports:
    # nginx inside the image listens on containerPort (8080); the Service
    # publishes the conventional 80, which the app's HTTPRoute targets.
    - port: {{ .Values.client.port }}
      targetPort: {{ .Values.client.containerPort }}
