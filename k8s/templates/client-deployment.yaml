apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shoot4fun.name" . }}-client
  labels:
    app: {{ include "shoot4fun.name" . }}-client
spec:
  replicas: {{ if .Values.paused }}0{{ else }}{{ .Values.client.replicas }}{{ end }}
  selector:
    matchLabels:
      app: {{ include "shoot4fun.name" . }}-client
  template:
    metadata:
      labels:
        app: {{ include "shoot4fun.name" . }}-client
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: client
          image: "{{ .Values.images.client.repository }}:{{ required "images.client.tag is empty; the deploy branch pins it" .Values.images.client.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.client.containerPort }}
