apiVersion: v1
kind: Service
metadata:
  # Literal DNS-1035 label matching the backendRef the platform's docs HTTPRoute
  # already targets (teams/shoot4fun/routes.yaml names shoot4fun-docs), so this
  # must be that literal rather than a template expression.
  name: shoot4fun-docs
  labels:
    app: {{ include "shoot4fun.name" . }}-docs
spec:
  selector:
    app: {{ include "shoot4fun.name" . }}-docs
  ports:
    - port: {{ .Values.docs.port }}
      targetPort: 80
