<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>client</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #0b0e14;
            }
            #app {
                width: 100%;
                height: 100%;
            }
            /* CSS owns the canvas layout; the renderer only sizes the buffer
               (renderer.setSize(w, h, false) - REF-ThreeJS section 3). */
            #app canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
