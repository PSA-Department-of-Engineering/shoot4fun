name: ci-caller

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (Python/FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: .venv/bin/python -m ruff check .
      - name: Pytest
        working-directory: backend
        env:
          DISABLE_TICK_LOOP: "1"
        run: .venv/bin/python -m pytest -q
      - name: CSD intent audit (backend)
        run: python -m csd_intent.cli .

  client:
    name: Client (Three.js/Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/client/package-lock.json
      - name: Install client
        working-directory: apps/client
        run: npm ci
      - name: Build
        working-directory: apps/client
        run: npm run build
      - name: Install Playwright
        working-directory: apps/client
        run: npx playwright install --with-deps chromium
      - name: E2E
        working-directory: apps/client
        run: npm run e2e
        env:
          SHOOT4FUN_HOST: "https://shoot4fun.chaos-architect.dev"

  build-images:
    name: Build + push GHCR images
    needs: [backend, client]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: server
            context: ./backend
            dockerfile: backend/Dockerfile
            image: ghcr.io/psa-department-of-engineering/shoot4fun-server
          - name: client
            context: .
            dockerfile: apps/client/Dockerfile
            image: ghcr.io/psa-department-of-engineering/shoot4fun-client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
