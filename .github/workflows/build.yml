# shoot4fun CI: a thin caller of the platform's reusable build workflow.
# The build logic lives once in PSA-Department-of-Engineering/ci; this only points
# at it, so it cannot drift. Runs on the in-cluster ARC runners.
name: ci-caller

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-caller:
    uses: PSA-Department-of-Engineering/ci/.github/workflows/build.yml@main
    permissions:
      contents: write
      packages: write
    secrets: inherit
