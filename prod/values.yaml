shoot4fun:
  images:
    server:
      tag: 1.1.0
      repository: ghcr.io/psa-department-of-engineering/shoot4fun-server
    client:
      tag: 1.1.0
      repository: ghcr.io/psa-department-of-engineering/shoot4fun-client
    docs:
      tag: 1.0.2
      repository: ghcr.io/psa-department-of-engineering/shoot4fun-docs
  database:
    # On here rather than in the chart default: this is the environment where the
    # platform-minted pg-app-shoot4fun credential actually exists, so the backend
    # takes its Postgres leaderboard instead of the in-memory fallback.
    enabled: true
    secret: pg-app-shoot4fun
