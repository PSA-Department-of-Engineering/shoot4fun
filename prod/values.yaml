# Shoot4Fun — prod environment (deploy-chaos)
# The image-updater writes <app>.images.<component>.tag here on each release.
paused: false

shoot4fun:
  images:
    server:
      tag: ""
    client:
      tag: ""

server:
  image:
    tag: ""
  replicas: 1

client:
  image:
    tag: ""
  replicas: 1

leaderboard:
  database:
    enabled: false
    secretName: pg-app-shoot4fun
