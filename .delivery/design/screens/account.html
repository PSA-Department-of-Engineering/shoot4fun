<section class="min-h-screen bg-background text-foreground p-6">
  <div class="mx-auto max-w-md">
    <div class="relative overflow-hidden rounded-lg border border-border bg-card text-card-foreground shadow-lg p-8 space-y-6">
      <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-primary to-accent"></div>
      <div class="space-y-1">
        <p class="text-xs font-bold uppercase tracking-widest text-muted-foreground">Account</p>
        <h1 class="text-2xl font-bold tracking-tight">Playing as</h1>
      </div>
      <div class="flex items-center gap-3 rounded-md border border-border bg-secondary p-4">
        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary text-primary-foreground font-bold">A</div>
        <div>
          <p class="font-semibold leading-tight" data-account-name>AnonymousRoo</p>
          <span class="inline-flex items-center rounded-full border border-border px-2 py-0.5 text-xs font-semibold text-muted-foreground">guest</span>
        </div>
      </div>
      <p class="text-sm text-muted-foreground">Log in to keep this name across every device. Guests play the same — login is optional and never blocks a match.</p>
      <div class="flex flex-col gap-2">
        <button class="inline-flex w-full items-center justify-center gap-2 rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:bg-primary/90">Keep this name</button>
        <button class="inline-flex w-full items-center justify-center gap-2 rounded-md border border-input bg-background px-4 py-2 text-sm font-medium hover:bg-accent">Sign in</button>
      </div>
      <div class="rounded-md border border-dashed border-border p-4 space-y-3">
        <p class="text-sm font-semibold text-foreground">Sign in with a recovery code</p>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-muted-foreground" for="sn">Display name</label>
          <input id="sn" class="mt-1 block w-full rounded-md border border-input bg-background px-3 py-2 text-sm" placeholder="Name" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-muted-foreground" for="sc">Recovery code</label>
          <input id="sc" class="mt-1 block w-full rounded-md border border-input bg-background px-3 py-2 text-sm tracking-widest" placeholder="XXXX-XXXX" />
        </div>
        <button class="inline-flex w-full items-center justify-center gap-2 rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:bg-primary/90">Sign in</button>
      </div>
    </div>
  </div>
</section>
